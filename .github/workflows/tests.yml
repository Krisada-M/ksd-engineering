name: tests
on:
  push:
  pull_request:
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        # macOS is the primary dev platform; its /var -> /private/var tmp symlink exposed a NOT_RUN bug ubuntu could not.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node validate-release.js
      - run: npm run lint
      - run: npm run build
      - run: git diff --exit-code -- plugins/engineering-proxy/dist/
      - run: test -z "$(git status --porcelain -- plugins/engineering-proxy/dist/)"
      - run: node plugins/engineering-proxy/test/benchmark.mjs
      - run: npm test
      - run: node --check plugins/engineering-proxy/index.js
      - run: node --check plugins/engineering-proxy/check-changed.js

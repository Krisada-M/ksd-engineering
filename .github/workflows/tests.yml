name: tests
on:
  push:
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node validate-release.js
      - run: npx --yes --package typescript@5.8.3 tsc -p plugins/engineering-proxy/tsconfig.json
      - run: git diff --exit-code -- plugins/engineering-proxy/dist/
      - run: node plugins/engineering-proxy/test/benchmark.mjs
      - run: node --test plugins/engineering-proxy/test/*.test.js
      - run: node --check plugins/engineering-proxy/index.js
      - run: node --check plugins/engineering-proxy/check-changed.js

name: tests
on:
  push:
  pull_request:
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        # macOS is the primary dev platform; its /var -> /private/var tmp symlink exposed a NOT_RUN bug ubuntu could not.
        os: [ubuntu-latest, macos-latest]
        node: ['22.13.0', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node validate-release.js
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: git diff --exit-code -- plugins/erosiano-dev/dist/
      - run: test -z "$(git status --porcelain -- plugins/erosiano-dev/dist/)"
      - run: node plugins/erosiano-dev/test/benchmark.mjs
      - run: npm test
      - run: node --check plugins/erosiano-dev/index.js
      - run: node --check plugins/erosiano-dev/check-changed.js
      # Ensure the submitted source+dist pair is internally consistent: a second build must be byte-stable.
      - run: npm run build && git diff --exit-code -- plugins/erosiano-dev/dist/

  runtime-floor:
    # Dependency-free import smoke on the plugin's declared Node >=20 floor (no root install/lint there).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20.0.0'
      - run: node --input-type=module -e "const { KsdRuntime } = await import('./plugins/erosiano-dev/dist/runtime.js'); console.log(typeof KsdRuntime); if (typeof KsdRuntime !== 'function') process.exit(1);"
      - run: node --input-type=module -e "await import('./plugins/erosiano-dev/dist/policy.js'); await import('./plugins/erosiano-dev/dist/sdlc.js'); console.log('policy+sdlc import ok')"
      - run: node --input-type=module -e "await import('./plugins/erosiano-dev/config.js'); await import('./plugins/erosiano-dev/review-verdict.js'); console.log('config+review-verdict import ok')"
      - name: Import dependency-free extension and companions
        run: node --input-type=module -e "const extension = await import('./plugins/erosiano-dev/index.js'); if (typeof extension.default !== 'function') process.exit(1); await import('./plugins/erosiano-dev/baseline.js'); const { readPracticeCatalog } = await import('./plugins/erosiano-dev/practices.js'); if (readPracticeCatalog().practices.length !== 138) process.exit(1); await import('./plugins/erosiano-dev/practice-tool.js'); await import('./plugins/erosiano-dev/intelligence.js'); console.log('extension and companions import ok')"

  omp-host:
    # Actual released OMP executable, not a mock host. No provider credentials, no user prompts.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Download and verify pinned OMP binary
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64)
              asset=omp-linux-x64
              digest=e8b937f9bf023baa147bdd300ad5421af0a6ef8b1f350c47a9a93d5fca94feca ;;
            Linux-aarch64)
              asset=omp-linux-arm64
              digest=92d4cce4b14814f6b838aa86dcec6359f0cb089cbcc300e8463cbb5326991fe0 ;;
            Darwin-arm64)
              asset=omp-darwin-arm64
              digest=43943119837612b2da72250ab7efe22ff8ca239eabebd4f702f34e3a144fdd3d ;;
            Darwin-x86_64)
              asset=omp-darwin-x64
              digest=4face26750f5679857a606a61df22b1587925d4b308d5938de470d8c780cd871 ;;
            *) echo 'Unsupported host architecture' >&2; exit 1 ;;
          esac
          binary="$RUNNER_TEMP/erosiano-omp-19.2.1"
          curl --fail --location --silent --show-error --proto '=https' --proto-redir '=https' --connect-timeout 15 --max-time 180 \
            "https://github.com/can1357/oh-my-pi/releases/download/v19.2.1/$asset" -o "$binary"
          node --input-type=module -e 'import {createHash} from "node:crypto"; import {readFileSync} from "node:fs"; if(createHash("sha256").update(readFileSync(process.argv[1])).digest("hex")!==process.argv[2]) process.exit(1)' "$binary" "$digest"
          chmod 0700 "$binary"
          echo "OMP_SMOKE_BINARY=$binary" >> "$GITHUB_ENV"
          echo "Verified OMP v19.2.1 $asset SHA-256 $digest"
      - name: Real OMP command and migration smoke
        shell: bash
        run: node plugins/erosiano-dev/test/eval/smoke-omp.mjs --omp "$OMP_SMOKE_BINARY"
      - name: Real OMP prompt injection with loopback fixture
        run: node plugins/erosiano-dev/test/eval/smoke-omp-prompt.mjs --omp "$OMP_SMOKE_BINARY"
